services:
  # Dynamic QR Studio — Backend & API Web Service on Render
  - type: web
    name: dynamic-qr-platform
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dynamic-qr-postgres
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: ANALYTICS_SALT
        generateValue: true

databases:
  # Managed PostgreSQL Database on Render
  - name: dynamic-qr-postgres
    plan: free
    region: oregon
    databaseName: dynamic_qr_db
    user: dynamic_qr_user
