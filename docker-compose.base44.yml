services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qruser
      POSTGRES_PASSWORD: qrpass
      POSTGRES_DB: dynamic_qr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qruser -d dynamic_qr"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: on-failure

  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://qruser:qrpass@postgres:5432/dynamic_qr?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        npm ci &&
        npx prisma generate &&
        npx prisma db push --accept-data-loss &&
        exec npx next dev -p 3000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 90s
    restart: on-failure

volumes:
  pgdata:
